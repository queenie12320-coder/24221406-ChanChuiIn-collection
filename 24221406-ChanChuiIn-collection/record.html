<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archival Repository</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .font-mono-specimen {
      font-family: 'JetBrains Mono', monospace;
    }

    .font-serif-document {
      font-family: 'Playfair Display', serif;
    }

    .perspective-1000 {
      perspective: 1000px;
    }

    .transform-style-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Isolated decay rules applied strictly to field value elements */
    .field-value {
      display: block;
      width: 100%;
      filter: blur(0px);
      opacity: 1;
      letter-spacing: normal;
      will-change: filter, opacity, letter-spacing;
      isolation: isolate;
    }

    /* Standard fields dissolve into background noise within 10 seconds */
    .field-value-standard {
      transition: filter 10s ease-out, opacity 10s ease-out, letter-spacing 10s ease-out;
    }

    .is-decayed .field-value-standard {
      filter: blur(8px);
      opacity: 0.04;
      letter-spacing: 0.35em;
    }

    /* The Survivor: "What was not captured" holds crisp legibility through 12s, fading only in the final seconds */
    .field-value-survivor {
      transition: filter 15s cubic-bezier(0.85, 0, 0.95, 1),
                  opacity 15s cubic-bezier(0.85, 0, 0.95, 1),
                  letter-spacing 15s cubic-bezier(0.85, 0, 0.95, 1);
    }

    .is-decayed .field-value-survivor {
      filter: blur(5px);
      opacity: 0.18;
      letter-spacing: 0.22em;
    }

    .instant-reset .field-value {
      transition: none !important;
    }

    /* Audio styling inside cards */
    audio::-webkit-media-controls-panel {
      background-color: #0f172a;
    }
    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display {
      color: #f59e0b;
    }

    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col selection:bg-amber-200 selection:text-slate-900">

  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div id="totalBadge" class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-mono text-sm font-bold shadow-inner">
          --
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-100 tracking-tight flex items-center gap-2">
            ARCHIVAL REPOSITORY
            <span id="collectionTitle" class="text-xs px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20 font-mono font-normal">ARTT3005</span>
          </h1>
          <p id="statsSubtitle" class="text-xs text-slate-400">Loading catalog items...</p>
        </div>
      </div>

      <!-- Filter Tabs & Search Bar -->
      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <div class="relative flex-1 md:w-56">
          <input type="text" id="searchInput" oninput="filterRecords()" placeholder="Search catalog..." class="w-full bg-slate-900 border border-slate-800 rounded-lg text-xs px-3 py-2 pl-8 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 transition-colors">
          <svg class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <div class="flex items-center bg-slate-900 p-1 rounded-lg border border-slate-800 text-xs font-medium">
          <button onclick="setCategoryFilter('all')" id="btnFilterAll" class="px-2.5 py-1 rounded-md text-amber-400 bg-slate-800 transition-all">All</button>
          <button onclick="setCategoryFilter('image')" id="btnFilterImage" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 transition-all">Image</button>
          <button onclick="setCategoryFilter('sound')" id="btnFilterSound" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 transition-all">Sound</button>
          <button onclick="setCategoryFilter('text')" id="btnFilterText" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 transition-all">Text</button>
        </div>

        <button onclick="fetchRecordsData(true)" title="Sync records.json" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-mono transition-all active:scale-95 cursor-pointer">
          <svg id="syncIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span id="syncText">Sync</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="recordsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Dynamically populated via JavaScript -->
    </div>
  </main>

  <div id="modalOverlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
    <div class="relative w-full max-w-[480px] flex flex-col items-center">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute -top-12 right-0 md:-right-10 text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-800 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>

      <!-- 3D Flippable Card Stage -->
      <div class="perspective-1000 w-full max-w-[460px] h-[580px]">
        
        <div id="cardInner" class="relative w-full h-full transition-transform duration-700 transform-style-3d rounded-2xl shadow-2xl">
          
          <!-- FRONT FACE -->
          <div id="cardFront" class="absolute inset-0 w-full h-full bg-slate-900 rounded-2xl border border-slate-700/60 p-6 flex flex-col justify-between backface-hidden text-slate-100 shadow-xl overflow-hidden">
            
            <div class="flex flex-col gap-4 h-full">
              <!-- Top Badge / Header -->
              <div class="flex items-center justify-between shrink-0 border-b border-slate-800 pb-2">
                <span id="valFrontBadge" class="text-[10px] font-mono uppercase tracking-widest px-2 py-0.5 rounded bg-slate-800 text-amber-400 border border-slate-700">IMAGE SPECIMEN</span>
                <span id="valFrontCatalog" class="text-xs font-mono text-slate-400">REC-001</span>
              </div>

              <!-- Media Showcase Box -->
              <div id="mediaBox" class="w-full h-56 bg-slate-950 rounded-xl border border-slate-800 flex flex-col items-center justify-center relative overflow-hidden shrink-0">
                <!-- Injected via JS depending on record type -->
              </div>

              <!-- Title & Location -->
              <div class="space-y-1 px-1 flex-1 overflow-y-auto">
                <h2 id="valFrontTitle" class="text-lg font-bold text-white tracking-tight leading-snug">
                  Loading Title...
                </h2>
                <p id="valFrontPlace" class="text-xs text-slate-400 font-normal leading-relaxed flex items-center gap-1.5">
                  <svg class="w-3.5 h-3.5 text-amber-400/80 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                  <span id="valFrontPlaceText">Loading Location...</span>
                </p>
                <p id="valFrontDate" class="text-[11px] text-slate-500 font-mono">Date: --</p>
              </div>

              <!-- Action Button (Flips Card) -->
              <button onclick="flipCard()" class="w-full py-3 px-4 bg-amber-500 hover:bg-amber-400 active:scale-[0.99] text-slate-950 text-xs font-bold uppercase tracking-wider rounded-xl shadow-lg shadow-amber-500/10 transition-all flex items-center justify-center gap-2 group shrink-0 cursor-pointer">
                <svg class="w-4 h-4 text-slate-900 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                <span>Examine Specimen Label</span>
              </button>
            </div>

          </div>

          <!-- BACK FACE (ARCHIVAL SPECIMEN LABEL) -->
          <div id="cardBack" class="absolute inset-0 w-full h-full bg-amber-50/95 rounded-2xl border border-slate-300 p-6 flex flex-col justify-between backface-hidden rotate-y-180 font-mono-specimen text-slate-900 shadow-xl">
            
            <div class="flex-1 flex flex-col justify-between border-2 border-slate-800 rounded-lg p-4 bg-amber-50/40 shadow-sm relative overflow-hidden">
              
              <div class="border-b-2 border-slate-800 pb-2 mb-2 flex items-center justify-between shrink-0">
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-600 select-none">Specimen Label</span>
                <span id="valCatalog" class="text-xs font-bold tracking-wider text-slate-900 bg-amber-100/80 border border-slate-700 px-2 py-0.5 rounded shadow-none select-none">REC-001</span>
              </div>

              <div class="space-y-2 text-xs flex-1 flex flex-col justify-between overflow-y-auto pr-1">
                
                <div class="border-b border-slate-300/80 pb-1.5 shrink-0">
                  <span class="block text-[9px] font-bold uppercase tracking-wider text-slate-500 mb-0.5 select-none">Title</span>
                  <p id="valTitle" class="field-value field-value-standard text-slate-900 font-bold truncate">...</p>
                </div>

                <div class="border-b border-slate-300/80 pb-1.5 shrink-0">
                  <span class="block text-[9px] font-bold uppercase tracking-wider text-slate-500 mb-0.5 select-none">Date and place</span>
                  <p id="valDatePlace" class="field-value field-value-standard text-slate-800 truncate">...</p>
                </div>

                <div class="border-b border-slate-300/80 pb-1.5 shrink-0">
                  <span class="block text-[9px] font-bold uppercase tracking-wider text-slate-500 mb-0.5 select-none">Recorded by</span>
                  <p id="valRecorder" class="field-value field-value-standard text-slate-800 truncate">...</p>
                </div>

                <div class="flex-1 min-h-[90px] bg-amber-100/40 p-2.5 rounded border border-slate-300/60 overflow-y-auto">
                  <span class="block text-[9px] font-bold uppercase tracking-wider text-amber-900/80 mb-1 select-none sticky top-0 bg-amber-50/80 backdrop-blur-sm">What was not captured</span>
                  <p id="valNotCaptured" class="field-value field-value-survivor text-slate-900 text-[11px] leading-relaxed italic font-medium whitespace-pre-wrap">
                    ...
                  </p>
                </div>

              </div>

              <div class="mt-2 pt-2 border-t border-slate-400 flex items-center justify-between text-[9px] text-slate-600 uppercase tracking-widest shrink-0 select-none">
                <span id="valCertainty">Certainty: --</span>
                <span>Archival Div.</span>
              </div>

            </div>

            <button onclick="flipCard()" class="w-full mt-3 py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-amber-400 text-xs font-bold uppercase tracking-wider rounded-xl transition-all duration-200 flex items-center justify-center gap-2 group shrink-0 cursor-pointer">
              <svg class="w-4 h-4 text-amber-400 group-hover:-rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
              <span>Return to Front</span>
            </button>

          </div>

        </div>

      </div>

    </div>
  </div>

  <script>
    const topicImageMap = {
      'BBQ': 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800&q=80',
      'Soup Pot': 'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80',
      'Neon Sign': 'https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=800&q=80',
      'Ding Ding Tram': 'https://images.unsplash.com/photo-1518684079-3c830dcef090?auto=format&fit=crop&w=800&q=80',
      'Bamboo Birdcage': 'https://images.unsplash.com/photo-1522926193341-e9ffd686c60f?auto=format&fit=crop&w=800&q=80',
      'Morning Market': 'https://images.unsplash.com/photo-1533900298318-6b8da08a523e?auto=format&fit=crop&w=800&q=80',
      'Seafood Glass Jars': 'https://images.unsplash.com/photo-1615485290382-441e4d049cb5?auto=format&fit=crop&w=800&q=80',
      'Cut Tulips': 'https://images.unsplash.com/photo-1520763185298-1b434c919102?auto=format&fit=crop&w=800&q=80',
      'Star Ferry': 'https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?auto=format&fit=crop&w=800&q=80',
      'Tong Lau Balcony': 'https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=800&q=80',
      'Herbal Tea': 'https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=800&q=80',
      'Clotheslines': 'https://images.unsplash.com/photo-1582735689369-4fe89db7114c?auto=format&fit=crop&w=800&q=80',
      'Mahjong Tiles': 'https://images.unsplash.com/photo-1611095790444-1dfa35e37b52?auto=format&fit=crop&w=800&q=80',
      'Steamer Stack': 'https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=800&q=80',
      'Alleyway Stray Cat': 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=80',
      'default': 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80'
    };

    function getFallbackImage(title) {
      if (!title) return topicImageMap['default'];
      for (const [key, url] of Object.entries(topicImageMap)) {
        if (title.toLowerCase().includes(key.toLowerCase())) return url;
      }
      return topicImageMap['default'];
    }

    let recordsData = [];
    let currentFilter = 'all';
    let isFlipped = false;
    let activeRecord = null;
    let lastJsonString = "";

    async function fetchTextFileContent(fileUrl) {
      if (!fileUrl) return null;
      try {
        const res = await fetch(fileUrl);
        if (!res.ok) throw new Error('Failed to fetch text file');
        const text = await res.text();
        return text.trimStart();
      } catch (err) {
        console.warn('Could not load external text file:', fileUrl, err);
        return null;
      }
    }

    function normalizeRecord(item) {
      const fileUrl = item.file || item.image || '';
      const rawText = item.text_content || '';
      return {
        catalog_id: item.id || item.catalog_id || 'REC-000',
        type: item.type || 'image',
        title: item.title || 'Untitled Specimen',
        date: item.date || '',
        place: item.place || '',
        recorder: item.recorder || '',
        file: fileUrl,
        image: fileUrl || getFallbackImage(item.title),
        text_content: rawText ? rawText.trimStart() : '',
        sound_preset: item.sound_preset || '',
        not_captured: item.not_captured || 'Not specified',
        certainty: item.certainty ?? 3
      };
    }

    async function fetchRecordsData(manual = false) {
      try {
        const syncIcon = document.getElementById('syncIcon');
        if (syncIcon && manual) syncIcon.classList.add('animate-spin');

        const cacheBuster = `?t=${Date.now()}`;
        const response = await fetch(`records.json${cacheBuster}`, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const rawText = await response.text();
        if (rawText === lastJsonString && !manual) {
          if (syncIcon && manual) syncIcon.classList.remove('animate-spin');
          return;
        }
        
        const data = JSON.parse(rawText);
        lastJsonString = rawText;

        const rawArray = Array.isArray(data) ? data : (data.records || []);
        if (data.collection) {
          document.getElementById('collectionTitle').textContent = data.collection;
        }

        const normalized = rawArray.map(normalizeRecord);

        // Pre-fetch external text file contents for text-type records if defined
        for (let rec of normalized) {
          if (rec.type === 'text' && rec.file && rec.file.endsWith('.txt')) {
            const loadedText = await fetchTextFileContent(rec.file);
            if (loadedText) {
              rec.text_content = loadedText.trimStart();
            }
          }
        }

        recordsData = normalized;
      } catch (err) {
        console.warn('Using embedded records dataset:', err);
        if (!recordsData.length) {
          recordsData = fallbackDataset.map(normalizeRecord);
        }
      } finally {
        const syncIcon = document.getElementById('syncIcon');
        if (syncIcon) {
          setTimeout(() => syncIcon.classList.remove('animate-spin'), 300);
        }
      }

      updateStatsAndFilterButtons();
      renderGallery();
    }

    const fallbackDataset = [
      { id: "REC-001", title: "BBQ", type: "image", file: "media/image1.jpg", date: "2026-08-00", place: "BBQ site, Shek O", recorder: "Queenie", not_captured: "The smell of charcoal and sizzling fat", certainty: 4 },
      { id: "REC-019", title: "Soup Story", type: "text", file: "media/description.txt", text_content: "My aunt's soup recipe passed down through generations in the quiet kitchen...", date: "2026-08-12", place: "my aunt's flat", recorder: "Queenie", not_captured: "her tone. I have written the words but not the way she said them.", certainty: 2 }
    ];

    function updateStatsAndFilterButtons() {
      const total = recordsData.length;
      const images = recordsData.filter(r => r.type === 'image').length;
      const sounds = recordsData.filter(r => r.type === 'sound' || r.type === 'audio').length;
      const texts = recordsData.filter(r => r.type === 'text').length;

      document.getElementById('totalBadge').textContent = total;
      document.getElementById('statsSubtitle').textContent = `${total} Total Specimens • ${images} Images • ${sounds} Audio • ${texts} Text`;

      document.getElementById('btnFilterAll').textContent = `All (${total})`;
      document.getElementById('btnFilterImage').textContent = `Image (${images})`;
      document.getElementById('btnFilterSound').textContent = `Sound (${sounds})`;
      document.getElementById('btnFilterText').textContent = `Text (${texts})`;
    }

    function renderGallery() {
      const grid = document.getElementById('recordsGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      const filtered = recordsData.filter(rec => {
        const isAudioMatch = currentFilter === 'sound' && (rec.type === 'sound' || rec.type === 'audio');
        const matchesCategory = currentFilter === 'all' || rec.type === currentFilter || isAudioMatch;
        const matchesSearch = rec.title.toLowerCase().includes(searchVal) ||
                              rec.place.toLowerCase().includes(searchVal) ||
                              rec.catalog_id.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-500 font-mono text-xs">
            <p class="tracking-widest">NO SPECIMENS FOUND MATCHING SEARCH QUERY.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(rec => {
        let typeIcon = '';
        const isSound = rec.type === 'sound' || rec.type === 'audio';

        if (rec.type === 'image') {
          typeIcon = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`;
        } else if (isSound) {
          typeIcon = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>`;
        } else {
          typeIcon = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`;
        }

        const fallbackUrl = getFallbackImage(rec.title);
        const displayType = isSound ? 'SOUND' : rec.type.toUpperCase();
        const rawTextContent = rec.text_content || rec.not_captured || 'No text stream loaded.';
        const cleanTextContent = rawTextContent.trimStart();

        return `
          <div onclick="openModal('${rec.catalog_id}')" class="group bg-slate-900 border border-slate-800 hover:border-amber-500/50 rounded-2xl p-5 flex flex-col justify-between transition-all duration-300 cursor-pointer h-[440px] shadow-lg">
            <div class="space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-mono uppercase tracking-wider px-2.5 py-0.5 rounded border bg-slate-800 text-amber-400 border-slate-700 flex items-center gap-1.5 font-bold">
                  ${typeIcon}
                  ${displayType}
                </span>
                <span class="text-xs font-mono text-slate-400">${rec.catalog_id}</span>
              </div>

              <!-- Media / Text Preview Area (Front of card) -->
              <div class="w-full h-40 bg-slate-950 rounded-xl overflow-hidden relative border border-slate-800 flex items-center justify-center">
                ${rec.type === 'image' ? `
                  <img src="${rec.file}" 
                       alt="${rec.title}" 
                       class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                       onerror="this.onerror=null; this.src='${fallbackUrl}'">
                ` : isSound ? `
                  <div class="w-full h-full p-3 flex flex-col items-center justify-between bg-slate-950 text-slate-300 relative">
                    <div class="w-full flex justify-between items-center text-[9px] font-mono text-amber-400">
                      <span>AUDIO RECORDING</span>
                    </div>
                    <div class="w-full flex items-center justify-center my-auto">
                      <svg class="w-10 h-10 text-amber-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                    </div>
                    <audio controls onclick="event.stopPropagation()" src="${rec.file}" class="w-full h-7 rounded"></audio>
                  </div>
                ` : `
                  <div class="w-full h-full p-3 bg-slate-950 text-slate-300 font-mono text-[11px] overflow-y-auto leading-relaxed whitespace-pre-wrap text-left">${cleanTextContent}</div>
                `}
              </div>

              <div>
                <h3 class="text-sm font-bold text-white group-hover:text-amber-400 transition-colors line-clamp-1">${rec.title}</h3>
                <p class="text-xs text-slate-400 line-clamp-1 mt-0.5">${rec.place}</p>
                <p class="text-[11px] text-slate-500 font-mono mt-1">📅 ${rec.date || 'UNKNOWN'}</p>
              </div>
            </div>

            <div>
              <button onclick="event.stopPropagation(); openModal('${rec.catalog_id}')" class="w-full py-2 px-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition-all text-xs uppercase tracking-wider cursor-pointer">
                Examine Label
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setCategoryFilter(category) {
      currentFilter = category;
      ['All', 'Image', 'Sound', 'Text'].forEach(cat => {
        const btn = document.getElementById(`btnFilter${cat}`);
        if (cat.toLowerCase() === category) {
          btn.className = 'px-2.5 py-1 rounded-md text-amber-400 bg-slate-800 transition-all';
        } else {
          btn.className = 'px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 transition-all';
        }
      });
      renderGallery();
    }

    function filterRecords() {
      renderGallery();
    }

    function openModal(catalogId) {
      activeRecord = recordsData.find(r => r.catalog_id === catalogId);
      if (!activeRecord) return;

      const isSound = activeRecord.type === 'sound' || activeRecord.type === 'audio';

      document.getElementById('valFrontCatalog').textContent = activeRecord.catalog_id;
      document.getElementById('valFrontTitle').textContent = activeRecord.title;
      document.getElementById('valFrontPlaceText').textContent = activeRecord.place;
      document.getElementById('valFrontDate').textContent = `Date: ${activeRecord.date || 'UNKNOWN'}`;
      document.getElementById('valFrontBadge').textContent = `${isSound ? 'SOUND' : activeRecord.type.toUpperCase()} SPECIMEN`;

      document.getElementById('valCatalog').textContent = activeRecord.catalog_id;
      document.getElementById('valTitle').textContent = activeRecord.title;
      document.getElementById('valDatePlace').textContent = `${activeRecord.date} — ${activeRecord.place}`;
      document.getElementById('valRecorder').textContent = activeRecord.recorder;
      document.getElementById('valNotCaptured').textContent = activeRecord.not_captured;
      document.getElementById('valCertainty').textContent = `Certainty: ${activeRecord.certainty}/5`;

      const mediaBox = document.getElementById('mediaBox');
      const fallbackUrl = getFallbackImage(activeRecord.title);

      if (activeRecord.type === 'image') {
        mediaBox.innerHTML = `
          <img src="${activeRecord.file}" 
               alt="${activeRecord.title}" 
               class="w-full h-full object-contain rounded-xl" 
               onerror="this.onerror=null; this.src='${fallbackUrl}'">
        `;
      } else if (isSound) {
        mediaBox.innerHTML = `
          <div class="w-full h-full p-4 flex flex-col items-center justify-between bg-slate-950 text-slate-300 border border-slate-800 rounded-xl relative overflow-hidden">
            <div class="w-full flex justify-between items-center font-mono text-[10px] text-amber-400 tracking-wider">
              <span>AUDIO ARCHIVE</span>
            </div>
            <div class="my-auto">
              <svg class="w-12 h-12 text-amber-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
            </div>
            <div class="w-full">
              <audio controls src="${activeRecord.file}" class="w-full h-9 rounded"></audio>
            </div>
          </div>
        `;
      } else if (activeRecord.type === 'text') {
        const textDisplayContent = (activeRecord.text_content || activeRecord.not_captured || 'Loading text stream...').trimStart();
        mediaBox.innerHTML = `
          <div class="w-full h-full p-4 bg-slate-950 border border-slate-800 rounded-xl flex flex-col relative overflow-hidden font-mono text-xs text-slate-200">
            <div class="text-[10px] text-amber-400 uppercase tracking-widest mb-2 font-bold">
              Text Transcript:
            </div>
            <div class="overflow-y-auto flex-1 pr-1 leading-relaxed whitespace-pre-wrap font-[Courier_New,Courier,monospace] text-left">
              ${textDisplayContent}
            </div>
          </div>
        `;
      }

      isFlipped = false;
      const cardInner = document.getElementById('cardInner');
      const cardBack = document.getElementById('cardBack');
      cardInner.classList.remove('rotate-y-180');
      cardBack.classList.add('instant-reset');
      cardBack.classList.remove('is-decayed');

      const overlay = document.getElementById('modalOverlay');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
      }, 10);
    }

    function closeModal() {
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    function flipCard() {
      const cardInner = document.getElementById('cardInner');
      const cardBack = document.getElementById('cardBack');
      isFlipped = !isFlipped;

      if (isFlipped) {
        cardInner.classList.add('rotate-y-180');
        cardBack.classList.remove('instant-reset');
        
        setTimeout(() => {
          cardBack.classList.add('is-decayed');
        }, 150);
      } else {
        cardInner.classList.remove('rotate-y-180');
        cardBack.classList.add('instant-reset');
        cardBack.classList.remove('is-decayed');
      }
    }

    setInterval(() => {
      fetchRecordsData(false);
    }, 2500);

    document.addEventListener('DOMContentLoaded', () => {
      fetchRecordsData();
    });
  </script>
</body>
</html>
